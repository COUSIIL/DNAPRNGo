services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - nuxt-app
      - nuxt-center
      - astro-app
      - go-backend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Command to run every 12 hours to renew certificates
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis-prod-data:/data
    restart: always

  go-backend:
    build:
      context: ./apps/go-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 8080
      CORS_ALLOW_ORIGINS: https://${APP_DOMAIN},https://${CENTER_DOMAIN}
    depends_on:
      - postgres
      - redis
    restart: always

  astro-app:
    build:
      context: .
      dockerfile: apps/astro-app/Dockerfile
    restart: always

  nuxt-app:
    build:
      context: .
      dockerfile: apps/nuxt-app/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
    restart: always

  nuxt-center:
    build:
      context: .
      dockerfile: apps/nuxt-center/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
    restart: always

  varq-email-worker:
    profiles: ["worker"]
    build:
      context: ./apps/go-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["./worker"] # Assuming we build the worker binary in Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      - postgres
      - redis
    restart: always

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer-prod
    restart: always
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-prod-data:/data

volumes:
  postgres-prod-data:
  redis-prod-data:
  certbot-www:
  certbot-conf:
  portainer-prod-data:
