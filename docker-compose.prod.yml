version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on:
      - nuxt-app
      - astro-app
      - go-backend
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Command to run every 12 hours to renew certificates
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    restart: always

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis-prod-data:/data
    restart: always

  go-backend:
    build:
      context: ./apps/go-backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 8080
    depends_on:
      - postgres
      - redis
    restart: always

  astro-app:
    build:
      context: .
      dockerfile: apps/astro-app/Dockerfile
    restart: always

  nuxt-app:
    build:
      context: .
      dockerfile: apps/nuxt-app/Dockerfile
    environment:
      NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
    restart: always

volumes:
  postgres-prod-data:
  redis-prod-data:
  certbot-www:
  certbot-conf:
