x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-service: &service
  restart: always
  logging: *default-logging

services:
  # ---------------------------------------------------------------- Proxy / TLS
  nginx:
    <<: *service
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Domains are injected into nginx/prod.conf.template at startup
      DOMAIN: ${DOMAIN}
      APP_DOMAIN: ${APP_DOMAIN}
      CENTER_DOMAIN: ${CENTER_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      NGINX_ENVSUBST_FILTER: "^(DOMAIN|APP_DOMAIN|CENTER_DOMAIN|API_DOMAIN)$$"
    volumes:
      - ./nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - nuxt-app
      - nuxt-center
      - astro-app
      - go-backend

  certbot:
    <<: *service
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    # Renew certificates every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  # ---------------------------------------------------------------- Data (internal network only)
  postgres:
    <<: *service
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-prod-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *service
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-prod-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- Apps
  go-backend:
    <<: *service
    build:
      context: ./apps/go-backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      API_PORT: 8080
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ALLOW_ORIGINS: https://${APP_DOMAIN},https://${CENTER_DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  astro-app:
    <<: *service
    build:
      context: .
      dockerfile: apps/astro-app/Dockerfile

  nuxt-app:
    <<: *service
    build:
      context: .
      dockerfile: docker/nuxt.Dockerfile
      target: runner
      args:
        APP: nuxt-app
    environment:
      NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
      NUXT_API_BASE_INTERNAL: http://go-backend:8080

  nuxt-center:
    <<: *service
    build:
      context: .
      dockerfile: docker/nuxt.Dockerfile
      target: runner
      args:
        APP: nuxt-center
    environment:
      NUXT_PUBLIC_API_BASE: https://${API_DOMAIN}
      NUXT_API_BASE_INTERNAL: http://go-backend:8080

  # Docker UI, reachable only through an SSH tunnel (127.0.0.1).
  # Disabled by default: it grants full control of the Docker daemon.
  # Enable with: docker compose -f docker-compose.prod.yml --profile tools up -d
  portainer:
    <<: *service
    profiles: ["tools"]
    image: portainer/portainer-ce:lts
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-prod-data:/data

volumes:
  postgres-prod-data:
  redis-prod-data:
  certbot-www:
  certbot-conf:
  portainer-prod-data:
