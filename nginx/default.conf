server_tokens off;
client_max_body_size 10m;

# Astro (landing)
server {
    listen 80;
    server_name localhost;

    location / {
        proxy_pass http://astro-app:4321;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/proxy-websocket.conf; # Astro HMR
    }
}

# Nuxt App
server {
    listen 80;
    server_name app.localhost;

    location / {
        proxy_pass http://nuxt-app:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/proxy-websocket.conf; # Nuxt HMR
    }
}

# Nuxt Center (admin)
server {
    listen 80;
    server_name center.localhost;

    location / {
        proxy_pass http://nuxt-center:3000;
        include /etc/nginx/snippets/proxy-headers.conf;
        include /etc/nginx/snippets/proxy-websocket.conf; # Nuxt HMR
    }
}

# Go API
server {
    listen 80;
    server_name api.localhost;

    location / {
        proxy_pass http://go-backend:8080;
        include /etc/nginx/snippets/proxy-headers.conf;
    }
}
